id: WS_RP_MS_Metadata__111
title: Process a signed X.509-hash Request Object.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__111.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  signed_request:
    from: pipeline.wallet.protocol.request-uri-method-get.outputs.signed_request_object
  wallet_response:
    from: pipeline.wallet.protocol.request-uri-method-get.outputs.wallet_response
assertions:
  - id: request_signature_matches_x509_leaf
    validator: jose.jws_signed_request
    input: evidence.signed_request
  - id: wallet_processes_signed_request
    validator: json.field_required
    input: evidence.wallet_response
    params:
      field: vp_token
verdict:
  pass_when: all_assertions_pass
