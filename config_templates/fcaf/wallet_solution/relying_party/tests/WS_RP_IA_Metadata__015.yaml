id: WS_RP_IA_Metadata__015
title: Resolve the decentralized identifier signing key and client metadata.
source:
  path: Interaction/Metadata/WS_RP_IA_Metadata__015.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  request_evidence:
    from: pipeline.wallet.metadata.did.outputs.request_evidence
  wallet_response:
    from: pipeline.wallet.metadata.did.outputs.wallet_response
assertions:
  - id: did_key_verifies_request_object
    validator: oid4vp.did_signed_request
    input: evidence.request_evidence
  - id: wallet_processes_did_request
    validator: json.field_required
    input: evidence.wallet_response
    params: {field: vp_token}
verdict: {pass_when: all_assertions_pass}
