id: WS_RP_MS_Metadata__129
title: Match the x509_hash client identifier to the leaf certificate.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__129.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  signed_request:
    from: pipeline.wallet.protocol.request-uri-method-get.outputs.signed_request_object
  wallet_response:
    from: pipeline.wallet.protocol.request-uri-method-get.outputs.wallet_response
assertions:
  - id: client_id_matches_x509_leaf_hash
    validator: oid4vp.x509_hash_client_id
